<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body class="app-body">
<header class="app-navbar">
<div class="logo"><span class="logo-mark">L</span> LocationApp</div>
<nav class="app-nav">
<a href="aimap.html">Map</a>

<main class="settings-page">
<div class="settings-card profile-card">

<div class="profile-info">
<div><span>Username</span><strong id="profileUsername2"></strong></div>
<div><span>Location Sharing</span><strong id="profileLocationStatus">Off</strong></div>
<div><span>Privacy Radius</span><strong id="profileRadius">1 mile</strong></div>
</div>

<a href="aiprivacy.html" class="button secondary full">Privacy Settings</a>
<a href="aimap.html" class="button primary full">Open Map</a>
</div>

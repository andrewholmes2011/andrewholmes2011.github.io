  <style>
    .download-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .download-card {
      display: flex;
      flex-direction: column;
      padding: 22px;
      border-radius: 14px;
    }

    .download-card h2 {
      margin: 12px 0 8px;
      color: var(--navy);
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .download-card p {
      margin-bottom: 10px;
      font-size: .86rem;
    }

    .download-card .file-meta {
      margin-top: auto;
      color: var(--muted);
      font-size: .75rem;
    }

    .download-card .button {
      width: 100%;
      margin-top: 12px;
      padding: 9px 12px;
      text-align: center;
      border-radius: 9px;
      font-size: .82rem;
    }

    @media (max-width: 800px) {
      .download-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .download-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

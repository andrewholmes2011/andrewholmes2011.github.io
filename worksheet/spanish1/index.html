<title>Spanish 1 Worksheets</title>
<style>
:root{--navy:#211447;--purple:#56349b;--gold:#f2b632;--ink:#252238;--muted:#716b80;--line:#e8e2f0}
*{box-sizing:border-box}body{margin:0;background:#f5f3f9;color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}
header{background:linear-gradient(125deg,var(--navy),var(--purple));color:white;padding:34px 22px}
.wrap{width:min(900px,calc(100% - 36px));margin:auto}h1{font-size:clamp(27px,4vw,38px);margin:0 0 8px}.sub{margin:0;color:#eee8ff}
main{padding:28px 0 55px}.back{display:inline-block;margin-bottom:20px;color:var(--purple);font-weight:700;text-decoration:none}
.file{display:flex;align-items:center;justify-content:space-between;gap:18px;background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.file h2{font-size:17px;margin:0 0 4px}.file p{margin:0;color:var(--muted);font-size:13px}
.details{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.detail{font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;background:#f0ebf8;color:var(--purple)}.detail.due{background:#fff3d8;color:#77500a}
.open{white-space:nowrap;background:var(--purple);color:white;text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:700}
.open:hover{background:var(--navy)}@media(max-width:560px){.file{align-items:flex-start;flex-direction:column}.open{width:100%;text-align:center}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Spanish 1 Worksheets</h1><p class="sub">Assignments, due dates, points, and worksheet files.</p></div></header>

</div>

</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090716">
<title>Halloween Media Screensaver</title>

<style>
:root {
  --night: #090716;
  --purple: #24113d;
  --orange: #ff7a18;
  --gold: #ffc15a;
  --moon: #fff0c9;
  --panel: rgba(15, 10, 29, .84);
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: #fff5e6;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 100%, #4b1d48 0%, transparent 54%),
    linear-gradient(180deg, #080716 0%, #17102d 48%, #311638 100%);
}

.sky-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 75% 23%, #5b347744 0%, transparent 38%);
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff4d6;
  animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
}

.moon {
  position: fixed;
  top: 8%;
  right: 13%;
  width: clamp(90px, 13vw, 165px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--moon);
  box-shadow: 0 0 35px #ffdf9a55, 0 0 95px #ffb75b22;
}

.moon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--night);
  transform: translate(-22%, -8%);
}

.scene-title {
  position: fixed;
  top: 8%;
  left: 6%;
  z-index: 2;
  max-width: 65%;
  text-shadow: 0 4px 24px #0008;
}

.kicker {
  color: #ffb45f;
  font-size: clamp(10px, 1.3vw, 15px);
  font-weight: bold;
  letter-spacing: .35em;
  text-transform: uppercase;
}

h1 {
  margin: 14px 0;
  color: #ff9a32;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(42px, 7vw, 100px);
  line-height: .9;
  letter-spacing: -.04em;
}

.subtitle {
  color: #e5c6e9;
  font-size: clamp(12px, 1.5vw, 18px);
}

.clock {
  position: fixed;
  top: 37%;
  left: 6%;
  z-index: 2;
  text-shadow: 0 4px 25px #0009;
}

.time {
  color: #fff0d5;
  font-size: clamp(30px, 5vw, 65px);
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.date {
  margin-top: 8px;
  color: #ffc15a;
  font-size: clamp(11px, 1.4vw, 16px);
  letter-spacing: .2em;
  text-transform: uppercase;
}

.ghost {
  position: fixed;
  z-index: 1;
  font-size: clamp(25px, 4vw, 55px);
  opacity: .75;
  animation: float 5s ease-in-out infinite alternate;
}

.g1 {
  left: 10%;
  bottom: 22%;
}

.g2 {
  left: 43%;
  bottom: 25%;
  animation-delay: -2s;
}

.g3 {
  right: 12%;
  top: 35%;
  animation: batFly 20s linear infinite;
}

.ground {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 20%;
  background: linear-gradient(180deg, transparent, #080610 35%);
  pointer-events: none;
}

.house {
  position: fixed;
  left: 43%;
  bottom: 11%;
  width: clamp(100px, 15vw, 190px);
  height: clamp(100px, 15vw, 190px);
  opacity: .88;
}

.roof {
  position: absolute;
  left: -10%;
  top: 0;
  width: 120%;
  height: 43%;
  background: #100b1b;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.house-body {
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 65%;
  background: #100b1b;
}

.window {
  position: absolute;
  top: 20%;
  width: 23%;
  height: 25%;
  background: #ffad3e;
  box-shadow: 0 0 18px #ff8c2a88;
}

.window.left {
  left: 13%;
}

.window.right {
  right: 13%;
}

.door {
  position: absolute;
  bottom: 0;
  left: 39%;
  width: 24%;
  height: 48%;
  background: #24102b;
  border: 2px solid #51314a;
}

.tree {
  position: fixed;
  right: 5%;
  bottom: 8%;
  width: 110px;
  height: 210px;
  opacity: .9;
}

.tree::before {
  content: "";
  position: absolute;
  left: 48%;
  bottom: 0;
  width: 12px;
  height: 65px;
  background: #100b1b;
}

.tree::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 110px;
  height: 160px;
  background: #100b1b;
  clip-path: polygon(50% 0, 70% 30%, 60% 30%, 90% 60%, 70% 57%, 100% 85%, 0 85%, 30% 57%, 10% 60%, 40% 30%, 30% 30%);
}

.bat {
  position: fixed;
  top: var(--top);
  left: -10%;
  font-size: 25px;
  animation: batFly var(--duration) linear infinite;
  pointer-events: none;
}

.pumpkin {
  position: fixed;
  bottom: 7%;
  z-index: 2;
  font-size: clamp(35px, 5vw, 65px);
  filter: drop-shadow(0 0 15px #ff7a1855);
  animation: pumpkinGlow 2s ease-in-out infinite alternate;
}

.p1 {
  left: 28%;
}

.p2 {
  right: 25%;
  animation-delay: -1s;
}

.player {
  position: fixed;
  z-index: 10;
  right: 24px;
  bottom: 24px;
  width: min(390px, calc(100vw - 32px));
  padding: 20px;
  border: 1px solid #ffb45f55;
  border-radius: 18px;
  background: var(--panel);
  box-shadow: 0 12px 45px #0008;
  backdrop-filter: blur(14px);
}

.player-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
}

.player-title {
  color: #ffb45f;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.status {
  color: #cbbbd9;
  font-size: 11px;
}

.track-name {
  overflow: hidden;
  margin-bottom: 5px;
  color: #fff4e5;
  font-size: 19px;
  font-weight: bold;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.track-status {
  min-height: 18px;
  margin-bottom: 12px;
  color: #cdbedb;
  font-size: 12px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 12px 0;
}

button {
  color: #fff4e5;
  cursor: pointer;
  border: 1px solid #ffffff24;
  background: #ffffff0d;
  transition: background .2s, transform .2s;
}

button:hover {
  background: #ff9a3230;
  border-color: #ffb45f88;
}

button:active {
  transform: scale(.96);
}

.control {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  font-size: 18px;
}

.play {
  width: 54px;
  height: 54px;
  color: #1b1020;
  background: #ffad42;
  border: none;
  font-size: 22px;
}

.play:hover {
  background: #ffc15a;
}

.progress-row {
  display: grid;
  grid-template-columns: 42px 1fr 42px;
  align-items: center;
  gap: 8px;
  color: #cdbedb;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  accent-color: #ff9a32;
  cursor: pointer;
}

.volume-row {
  display: grid;
  grid-template-columns: 20px 1fr;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}

.playlist {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 120px;
  margin-top: 14px;
  overflow-y: auto;
}

.track {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border-radius: 8px;
  text-align: left;
  font-size: 12px;
}

.track.active {
  color: #ffc15a;
  background: #ff9a3220;
  border-color: #ffb45f66;
}

.track-number {
  width: 18px;
  color: #cdbedb;
}

.track-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-footer {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.small-button {
  flex: 1;
  padding: 10px 8px;
  border-radius: 9px;
  font-size: 11px;
}

#fileInput {
  display: none;
}

.hide-player {
  position: fixed;
  z-index: 11;
  right: 24px;
  bottom: 24px;
  display: none;
  padding: 12px 16px;
  border-radius: 10px;
  background: #1a1029e8;
  border-color: #ffb45f66;
}

.hint {
  position: fixed;
  left: 18px;
  bottom: 15px;
  z-index: 12;
  color: #d5bed8;
  font-size: 11px;
  opacity: .75;
}

@keyframes twinkle {
  from { opacity: .25; transform: scale(.8); }
  to { opacity: 1; transform: scale(1.2); }
}

@keyframes float {
  from { transform: translateY(0) rotate(-5deg); }
  to { transform: translateY(-22px) rotate(5deg); }
}

@keyframes batFly {
  from { transform: translateX(0) translateY(0); }
  to { transform: translateX(120vw) translateY(-25px); }
}

@keyframes pumpkinGlow {
  from { filter: brightness(.9) drop-shadow(0 0 5px #ff7a1855); }
  to { filter: brightness(1.15) drop-shadow(0 0 20px #ff7a18aa); }
}

@media (max-width: 700px) {
  .scene-title {
    top: 5%;
    left: 5%;
    max-width: 80%;
  }

  .moon {
    top: 10%;
    right: 5%;
    width: 90px;
  }

  .clock {
    top: 32%;
    left: 5%;
  }

  .player {
    right: 12px;
    bottom: 42px;
    width: min(360px, calc(100vw - 24px));
    padding: 15px;
  }

  .house {
    left: 8%;
    bottom: 13%;
  }

  .tree {
    right: 2%;
    transform: scale(.7);
    transform-origin: bottom right;
  }

  .p1 {
    left: 35%;
  }

  .p2 {
    right: 17%;
  }

  .hint {
    bottom: 10px;
    left: 10px;
  }
}
</style>
</head>

<body>
<div class="sky-glow"></div>
<div class="stars" id="stars"></div>
<div class="moon"></div>

<header class="scene-title">
  <div class="kicker">October • Spooky Season</div>
  <h1>HAPPY<br>HALLOWEEN</h1>
  <p class="subtitle">A little spooky. A lot of magic.</p>
</header>

<div class="clock">
  <div class="time" id="time">12:00:00 AM</div>
  <div class="date" id="date">HALLOWEEN NIGHT</div>
</div>

<div class="ghost g1">👻</div>
<div class="ghost g2">👻</div>
<div class="ghost g3">🦇</div>

<div class="bat" style="--top:33%;--duration:17s">🦇</div>
<div class="bat" style="--top:60%;--duration:22s;animation-delay:-8s">🦇</div>
<div class="bat" style="--top:15%;--duration:25s;animation-delay:-14s">🦇</div>

<div class="house">
  <div class="roof"></div>
  <div class="house-body">
    <div class="window left"></div>
    <div class="window right"></div>
    <div class="door"></div>
  </div>
</div>

<div class="tree"></div>
<div class="pumpkin p1">🎃</div>
<div class="pumpkin p2">🎃</div>
<div class="ground"></div>

<section class="player" id="player">
  <div class="player-header">
    <div class="player-title">Spooky Soundtrack</div>
    <div class="status" id="status">READY</div>
  </div>

  <div class="track-name" id="trackName">Song 1</div>
  <div class="track-status" id="trackStatus">Press play to start your music.</div>

  <audio id="audio" preload="metadata"></audio>

  <div class="progress-row">
    <span id="currentTime">0:00</span>
    <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Track progress">
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button class="control" id="previous" title="Previous track" aria-label="Previous track">⏮</button>
    <button class="control play" id="playPause" title="Play" aria-label="Play">▶</button>
    <button class="control" id="next" title="Next track" aria-label="Next track">⏭</button>
  </div>

  <div class="volume-row">
    <span aria-hidden="true">🔊</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
  </div>

  <div class="playlist" id="playlist"></div>

  <div class="player-footer">
    <button class="small-button" id="chooseFiles">＋ Add Audio Files</button>
    <button class="small-button" id="hideButton">Hide Player</button>
  </div>

  <input id="fileInput" type="file" accept="audio/*" multiple>
</section>

<button class="hide-player" id="showButton">♫ Show Music Player</button>
<div class="hint" id="hint">F: Fullscreen • H: Hide hints • M: Hide/show player</div>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const trackName = document.getElementById("trackName");
const trackStatus = document.getElementById("trackStatus");
const statusText = document.getElementById("status");
const playlistElement = document.getElementById("playlist");
const fileInput = document.getElementById("fileInput");
const player = document.getElementById("player");
const showButton = document.getElementById("showButton");
const hint = document.getElementById("hint");

let tracks = [
  { name: "Song 1", src: "./audio1.mp3", local: false },
  { name: "Song 2", src: "./audio2.mp3", local: false },
  { name: "Song 3", src: "./audio3.mp3", local: false }
];

let currentTrack = 0;
let isSeeking = false;

function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });
}

function makeStars() {
  const stars = document.getElementById("stars");

  for (let i = 0; i < 100; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 85 + "%";
    star.style.width = (Math.random() * 2 + 1) + "px";
    star.style.height = star.style.width;
    star.style.setProperty("--duration", (Math.random() * 3 + 2) + "s");
    star.style.animationDelay = (Math.random() * 4) + "s";
    stars.appendChild(star);
  }
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = Math.floor(seconds % 60);

  return minutes + ":" + String(remainingSeconds).padStart(2, "0");
}

function renderPlaylist() {
  playlistElement.innerHTML = "";

  tracks.forEach((track, index) => {
    const button = document.createElement("button");
    button.className = "track" + (index === currentTrack ? " active" : "");

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent = index === currentTrack && !audio.paused ? "♫" : String(index + 1);

    const label = document.createElement("span");
    label.className = "track-label";
    label.textContent = track.name;

    button.append(number, label);
    button.addEventListener("click", () => loadTrack(index, true));
    playlistElement.appendChild(button);
  });
}

function loadTrack(index, shouldPlay) {
  if (!tracks.length) return;

  currentTrack = (index + tracks.length) % tracks.length;

  audio.pause();
  audio.src = tracks[currentTrack].src;
  audio.load();

  trackName.textContent = tracks[currentTrack].name;
  trackStatus.textContent = "Loading audio...";
  statusText.textContent = "READY";
  progress.value = 0;
  document.getElementById("currentTime").textContent = "0:00";
  document.getElementById("duration").textContent = "0:00";
  playPause.textContent = "▶";
  playPause.title = "Play";

  renderPlaylist();

  if (shouldPlay) {
    playAudio();
  }
}

async function playAudio() {
  try {
    await audio.play();
    playPause.textContent = "❚❚";
    playPause.title = "Pause";
    trackStatus.textContent = "Now playing";
    statusText.textContent = "PLAYING";
    renderPlaylist();
  } catch (error) {
    playPause.textContent = "▶";
    playPause.title = "Play";
    statusText.textContent = "NOT PLAYING";
    trackStatus.textContent =
      "Couldn't play this file. Check its filename and folder, then try Play again.";
    console.error("Audio playback error:", error);
  }
}

function pauseAudio() {
  audio.pause();
  playPause.textContent = "▶";
  playPause.title = "Play";
  statusText.textContent = "PAUSED";
  trackStatus.textContent = "Music paused.";
  renderPlaylist();
}

playPause.addEventListener("click", () => {
  if (audio.paused) {
    playAudio();
  } else {
    pauseAudio();
  }
});

document.getElementById("previous").addEventListener("click", () => {
  loadTrack(currentTrack - 1, true);
});

document.getElementById("next").addEventListener("click", () => {
  loadTrack(currentTrack + 1, true);
});

audio.addEventListener("loadedmetadata", () => {
  document.getElementById("duration").textContent = formatTime(audio.duration);
  trackStatus.textContent = "Ready to play.";
});

audio.addEventListener("timeupdate", () => {
  if (!isSeeking && Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = Math.round((audio.currentTime / audio.duration) * 1000);
  }

  document.getElementById("currentTime").textContent =
    formatTime(audio.currentTime);
});

audio.addEventListener("play", () => {
  playPause.textContent = "❚❚";
  statusText.textContent = "PLAYING";
  renderPlaylist();
});

audio.addEventListener("pause", () => {
  playPause.textContent = "▶";

  if (audio.ended) return;

  statusText.textContent = "PAUSED";
  renderPlaylist();
});

audio.addEventListener("ended", () => {
  loadTrack(currentTrack + 1, true);
});

audio.addEventListener("error", () => {
  const track = tracks[currentTrack];

  if (!track) return;

  statusText.textContent = "AUDIO ERROR";
  trackStatus.textContent =
    "Unable to load " + track.name +
    ". Make sure the MP3 exists and its filename matches exactly.";
});

progress.addEventListener("input", () => {
  isSeeking = true;
  document.getElementById("currentTime").textContent =
    formatTime((Number(progress.value) / 1000) * (audio.duration || 0));
});

progress.addEventListener("change", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
  }

  isSeeking = false;
});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

document.getElementById("chooseFiles").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const files = Array.from(fileInput.files || [])
    .filter(file => file.type.startsWith("audio/"));

  if (!files.length) return;

  const newTracks = files.map(file => ({
    name: file.name,
    src: URL.createObjectURL(file),
    local: true
  }));

  tracks.push(...newTracks);
  renderPlaylist();
  trackStatus.textContent = files.length + " audio file(s) added.";
  fileInput.value = "";
});

document.getElementById("hideButton").addEventListener("click", () => {
  player.style.display = "none";
  showButton.style.display = "block";
});

showButton.addEventListener("click", () => {
  player.style.display = "block";
  showButton.style.display = "none";
});

document.addEventListener("keydown", async event => {
  const tag = document.activeElement.tagName;

  if (tag === "INPUT" || tag === "TEXTAREA") return;

  if (event.key.toLowerCase() === "f") {
    if (!document.fullscreenElement) {
      try {
        await document.documentElement.requestFullscreen();
      } catch (error) {
        console.log("Fullscreen was not available.");
      }
    } else {
      document.exitFullscreen();
    }
  }

  if (event.key.toLowerCase() === "h") {
    hint.style.display = hint.style.display === "none" ? "block" : "none";
  }

  if (event.key.toLowerCase() === "m") {
    const hidden = player.style.display === "none";
    player.style.display = hidden ? "block" : "none";
    showButton.style.display = hidden ? "none" : "block";
  }

  if (event.code === "Space") {
    event.preventDefault();

    if (audio.paused) {
      playAudio();
    } else {
      pauseAudio();
    }
  }

  if (event.key === "ArrowRight") {
    loadTrack(currentTrack + 1, true);
  }

  if (event.key === "ArrowLeft") {
    loadTrack(currentTrack - 1, true);
  }
});

document.addEventListener("dblclick", async () => {
  if (!document.fullscreenElement) {
    try {
      await document.documentElement.requestFullscreen();
    } catch (error) {
      console.log("Fullscreen was not available.");
    }
  }
});

audio.volume = Number(volume.value);
makeStars();
updateClock();
setInterval(updateClock, 1000);
renderPlaylist();
loadTrack(0, false);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map - LocationApp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="aistyles.css">
</head>
<body class="app-body">
<header class="app-navbar">
<div class="logo"><span class="logo-mark">L</span> LocationApp</div>
<nav class="app-nav">
<a href="aimap.html">Map</a>
<a href="aiprofile.html">Profile</a>
<a href="aiprivacy.html">Privacy</a>
<button onclick="logout()" class="logout-button">Logout</button>
</nav>
</header>

<main class="map-page">
<div class="map-header">
<div>
<span class="badge">LIVE MAP</span>
<h1>Nearby People</h1>
<p id="welcomeText">Loading your account...</p>
</div>
<div class="status-pill"><span class="status-dot"></span><span id="privacyStatus">Location protected</span></div>
</div>

<div class="map-layout">
<section class="map-card">
<div id="map" aria-label="Approximate location map"></div>
<div class="map-legend">
<span><i class="legend-dot self"></i> You</span>
<span><i class="legend-dot other"></i> Other visible users</span>
</div>
</section>

<aside class="map-panel">
<h2>Your Location</h2>
<p id="locationStatus">Location sharing is off.</p>
<button id="locationButton" onclick="toggleLocation()" class="button primary full">Turn On Location</button>
<button onclick="refreshNearbyUsers()" class="button secondary full">Refresh Map</button>
<div class="privacy-note">
<strong>Approximate only</strong>
<p>Your map marker is intentionally offset using your selected privacy radius.</p>
</div>
</aside>
</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="aiapp.js"></script>
<script>requireLogin(); initializeMap();</script>
</body>
</html>
